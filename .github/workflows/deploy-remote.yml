name: Deploy remote

# Deploys the Worker at newgit.dev and its Git endpoint image. The image holds
# a newgit binary built from this repository, so any change on main can change
# what is deployed, not only changes under remote/.
on:
  # Only after CI has passed on the commit being deployed.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway: a deploy cut off after
# pushing the image but before uploading the Worker leaves them out of step.
concurrency:
  group: deploy-remote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI passed on, not whatever main is by the time this runs.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check the Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "$name is not set. Set it with: gh secret set $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: remote/package-lock.json

      - run: npm ci

      - name: Deploy
        # The Worker's own secrets (TOKEN_KEY, ALLOWED_LOGINS) live in
        # Cloudflare and survive a deploy; nothing here sets them.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Check it answers
        run: |
          set -euo pipefail
          body="$(curl -sS https://newgit.dev/v1/me)"
          echo "$body"
          echo "$body" | grep -q "not logged in"
