name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pushing twice to a branch should not run the first commit to completion.
# Only for pull requests: a run on main is the record of whether that commit
# was green, and cancelling it would leave the answer unknown.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A failed build should not also cost a debuginfo write; tests do not read it.
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test:
    # Keep this name: the ruleset on main requires it.
    name: test (ubuntu-latest)
    # newgit drives real `git`, spawns real process groups, and binds real
    # ports, so its tests are integration tests by nature. They have to run
    # on both platforms it claims to support — a unit-test-only CI would
    # prove almost nothing about this codebase. macOS has its own workflow,
    # ci-macos.yml, so that deploying the remote (which waits on this
    # workflow, and ships a Linux image) does not wait on the macOS runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check changelog fragments
        # A misnamed fragment is not picked up by the release script's
        # category globs, so the entry would go missing from the release
        # rather than fail anything. Catch it on the PR that wrote it.
        # ci-macos.yml runs it too, which keeps the script honest about BSD
        # vs GNU userland, the same trap the release workflow hit.
        run: ./scripts/release-changelog.sh --check

      - name: Identify git
        # The suite makes real commits; a runner with no identity configured
        # fails in a way that looks like a newgit bug.
        run: |
          git config --global user.name "newgit ci"
          git config --global user.email "ci@newgit.invalid"
          git config --global init.defaultBranch main
          # The suite runs thousands of git commands, and git follows fetches
          # and commits with its own background maintenance. That is pure
          # overhead in throwaway repos.
          git config --global maintenance.auto false
          git config --global gc.auto 0
          git --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        # nextest, not `cargo test`: `cargo test` runs the ~110 test binaries
        # one after another, and most hold only a few tests that spend their
        # time waiting on git, so the runner's cores sit idle. nextest runs
        # tests from every binary at once.
        run: cargo nextest run --workspace --all-targets --no-fail-fast

      - name: Release build
        run: cargo build --release --locked

      - name: Smoke test the release binary
        # Proves the artifact users install actually runs, which a debug-only
        # test run does not: the release profile strips symbols and the
        # binary has to work from a clean project.
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/target/release/newgit"
          "$BIN" --version
          WORK="$(mktemp -d)"
          cd "$WORK"
          git init -q -b main .
          echo hello > README.md
          git add -A
          git commit -qm "initial"
          "$BIN" init
          "$BIN" tracker create runtime-env --audience user
          "$BIN" tracker track runtime-env .env.local
          "$BIN" spawn ci-check
          echo "SECRET=ci" > "$("$BIN" status ci-check | tail -1 | awk '{print $NF}')/.env.local"
          "$BIN" checkpoint ci-check -m "smoke"
          "$BIN" undo ci-check
          "$BIN" export ci-check --to "$WORK/exported"
          test ! -e "$WORK/exported/.env.local"  # audience filter held
          "$BIN" remove ci-check
          "$BIN" cleanup

  minimum-rust:
    name: minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from the workspace manifest
        id: msrv
        # Single source of truth: the manifest already declares it, so CI
        # must not carry a second copy that can drift.
        run: |
          version="$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV: $version"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  remote:
    name: remote (Worker)
    # The newgit remote is a separate TypeScript package; its tests run in the
    # Workers runtime under Miniflare, with Artifacts faked (it has no local
    # binding).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: remote/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit && npx tsc --noEmit -p test
      - name: Test
        run: npx vitest run
