[package]
name = "newgit-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core domain model for newgit: branch instances, tracker lanes, and resource lifecycles"
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
camino = { version = "1.2", features = ["serde1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# Process-group signalling and reaping (see supervisor.rs), and low-level
# socket options (see ports.rs: the port-bind probe needs SO_REUSEADDR
# off, which std's TcpListener does not expose).
# Substring search for the path scan (see installs.rs): SIMD where the
# platform has it, against a byte-by-byte window compare.
memchr = "2"
nix = { version = "0.31", features = ["signal", "process", "net", "fs"] }
# The path scan reads every produced tree in full; one thread over 3.8 GB
# took longer than the install it was vetting.
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1.1"
ureq = { version = "3.4.2", features = ["json"] }

# `clonefile(2)` on a whole directory tree (see installs.rs: `cp -c`
# clones one file at a time, which is slower than the install it replaces).
[target.'cfg(target_os = "macos")'.dependencies]
reflink-copy = "0.1"

[dev-dependencies]
tempfile = "3"
