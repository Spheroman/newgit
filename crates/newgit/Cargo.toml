[package]
name = "newgit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Branch-bound tracker and resource orchestration for parallel agent development"
keywords = ["vcs", "git", "workspace", "agents", "orchestration"]
categories = ["development-tools", "command-line-utilities"]
readme = "../../README.md"

[[bin]]
name = "newgit"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1"
camino = "1.2"
clap = { version = "4.5", features = ["derive", "env"] }
# The version is required to publish: crates.io resolves it from the
# registry and drops the path, so the two must be released together.
newgit-core = { path = "../newgit-core", version = "0.10.1" }
newgit-serve = { path = "../newgit-serve", version = "0.10.1" }
serde_json = "1.0.151"

[dev-dependencies]
# Serve's tests read and write a row of its database directly.
rusqlite = { version = "0.41", features = ["bundled"] }
# The encrypted-tracker tests decrypt with an attacker's key, to show they
# cannot (#338).
age = "0.12"
