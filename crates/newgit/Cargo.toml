[package]
name = "newgit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Branch-bound tracker and resource orchestration for parallel agent development"
keywords = ["vcs", "git", "workspace", "agents", "orchestration"]
categories = ["development-tools", "command-line-utilities"]
readme = "../../README.md"

[[bin]]
name = "newgit"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1"
camino = "1.2"
clap = { version = "4.5", features = ["derive"] }
# The version is required to publish: crates.io resolves it from the
# registry and drops the path, so the two must be released together.
newgit-core = { path = "../newgit-core", version = "0.2.0" }
