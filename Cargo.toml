[workspace]
members = [
    "crates/newgit",
    "crates/newgit-core",
]
# The `t3code` tracker, mounted here, has its own crates (native/*): they
# build on their own, not as members of newgit's workspace.
exclude = ["apps/t3code"]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.96.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Spheroman/newgit"
homepage = "https://github.com/Spheroman/newgit"
authors = ["Jack Wen"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Release binaries are what people actually install, and newgit sits in the
# inner loop of every command an agent runs — startup cost is felt.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
