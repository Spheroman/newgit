[tools]
rust = "1.96.1"

[tasks.fmt]
description = "Format the Rust workspace"
run = "cargo fmt --all"

[tasks.check]
description = "Check all Rust targets"
run = "cargo check --workspace --all-targets"

[tasks.test]
description = "Run the Rust test suite"
run = "cargo test --workspace --all-targets"

[tasks.clippy]
description = "Run Clippy with warnings denied"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.fmt-check]
description = "Verify formatting without rewriting files"
run = "cargo fmt --all --check"

# Depends on fmt-check, not fmt: a gate that silently reformats your tree is
# not the same gate CI runs.
[tasks.ci]
description = "Everything CI runs, in the same order"
depends = ["fmt-check", "clippy", "test"]

[tasks.build-release]
description = "Build the release binary"
run = "cargo build --release --locked -p newgit"

[tasks.install]
description = "Install the newgit binary into ~/.cargo/bin"
run = "cargo install --path crates/newgit --locked"

# Normally CI publishes on a tag. This is the manual path: a first release,
# or recovery when a tagged run fails partway. `--workspace` publishes
# newgit-core before newgit and resolves the dependency through a temporary
# registry, so ordering and index waits are cargo's problem, not yours.
#
# crates.io versions can be yanked but never replaced or deleted, so the dry
# run is not optional.
[tasks.publish]
description = "Publish both crates to crates.io (dry run first)"
run = [
    "cargo publish --workspace --locked --dry-run",
    "cargo publish --workspace --locked",
]
