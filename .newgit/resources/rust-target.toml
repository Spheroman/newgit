# The Rust build output under `target/`: a path-dependent artifact, so a
# resource rather than something a checkpoint copies. Cargo rebuilds it
# from `Cargo.lock` and the source, lazily, on the next build, so the tree
# this resource "builds" is an empty directory and `prepare` only makes it.
#
# Declaring it is how `newgit stop --evict` knows `target/` may go: evict
# refuses to delete an ignored file nobody declared, and keeps quiet about
# a bound resource's `[identity] produces` with a `recompute` restore.
# After the `start` that restores the workspace, `target/` is empty and the
# first `cargo build` fills it again.
#
# Costs: `[identity] produces` needs a `prepare` with a command, so this is
# one (`rm -rf` first, so the install store only ever stores an empty
# tree, never gigabytes of build output); and an `undo` across a change to
# `Cargo.lock` recomputes, which empties `target/` and costs a rebuild.
ownership = "workspace"

[identity]
paths = ["Cargo.lock"]
produces = ["target"]

[actions.prepare]
command = "rm -rf target && mkdir target"

[checkpoint]
mode = "hash"

[restore]
mode = "recompute"
